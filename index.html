<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codersonet | research engineer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="github-container">
    <header class="profile-header">
      <div class="fluid-canvas-container">
        <canvas id="waveCanvas"></canvas>
        <div class="banner-title">HELLO WORLD!</div>
      </div>

      <div class="typing-box">
        <span id="typingText"></span><span class="cursor">|</span>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">⚡ About Me</h2>
      <div class="code-block">
<pre><code><span class="key">developer</span>:
  <span class="key">name</span>: <span class="string">Sanidhya Uniyal</span>
  <span class="key">role</span>: <span class="string">Research Engineer</span>
  <span class="key">core_stack</span>: [<span class="string">Python</span>, <span class="string">R</span>, <span class="string">C</span>, <span class="string">C++</span>]
  <span class="key">status</span>: <span class="string">🚀 Building Intelligent Solid State Devices</span></code></pre>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">🚀 Tech Stack</h2>
      <div class="badge-grid">
        <span class="badge badge-python">Python</span>
        <span class="badge badge-react">C</span>
        <span class="badge badge-ts">C++</span>
        <span class="badge badge-node">R</span>
        <span class="badge badge-docker">APIs</span>
        <span class="badge badge-postgres">PostgreSQL</span>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">🌊 Contributions</h2>
      <div class="snake-container">
        <canvas id="snakeCanvas" width="700" height="120"></canvas>
      </div>
    </section>

    <footer class="profile-footer">
      <div class="fluid-canvas-container footer-canvas">
        <canvas id="footerWaveCanvas"></canvas>
        <div class="footer-text">Designed with ❤️ | Visitor Count: 18,563</div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
